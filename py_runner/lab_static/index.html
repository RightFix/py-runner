<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>py-runner lab</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <aside id="files">
      <div class="pane-head">
        <span>Notebooks</span>
        <button id="new-nb" title="New notebook">+ New</button>
      </div>
      <ul id="file-list"></ul>
      <div id="kernel-pill" title="Kernel backend">● connecting…</div>
    </aside>
    <main id="nb">
      <div id="toolbar">
        <span id="filename">No notebook open</span>
        <button id="run-all" disabled>▶ All</button>
        <button id="stop" disabled>⏹</button>
        <button id="add-code" disabled>+ Code</button>
        <button id="add-md" disabled>+ Markdown</button>
        <button id="save" disabled>Save</button>
      </div>
      <div id="cells"><p class="hint">Pick a notebook on the left, or create one.</p></div>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
