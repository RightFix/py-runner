[project]
name = "py-runner"
version = "0.1.0"
description = "Persistent Python code runner: string in, JSON out. A lightweight, dependency-free ipykernel-like execution library."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE*"]
authors = [
    { name = "RightFix", email = "righteousnessude@gmail.com" }
]
keywords = ["jupyter", "kernel", "repl", "code-execution", "data-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Interpreters",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Opt-in stacks; core stays dependency-free. Open ranges to avoid pins.
# Combine as needed, e.g. pip install "py-runner[data,ml]".
data = ["pandas>=2", "numpy>=1.26", "matplotlib>=3.8", "pillow>=10", "tqdm>=4.66"]
ml = ["scikit-learn>=1.3", "torch>=2.2"]
full = [
    "pandas>=2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10",
    "tqdm>=4.66",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "opencv-python>=4.9",
    "plotly>=5.18",
]

[project.scripts]
py-runner = "py_runner:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
