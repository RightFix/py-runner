[project]
name = "py-runner-kernel"
version = "0.1.0"
description = "Persistent Python code runner: string in, JSON out. A lightweight, dependency-free ipykernel-like execution library."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE*"]
authors = [
    { name = "RightFix", email = "righteousnessude@gmail.com" }
]
keywords = ["jupyter", "kernel", "repl", "code-execution", "data-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Interpreters",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
py-runner = "py_runner:main"
py-runner-serve = "py_runner.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py_runner"]

[tool.hatch.build.targets.sdist]
exclude = [".python-version", "uv.lock", ".venv", "dist"]
